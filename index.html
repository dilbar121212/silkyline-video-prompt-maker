<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Silkyline Video Prompt Maker - Turn your stories into scene-by-scene AI video prompts for Veo, Runway, and Kling." />
    <meta property="og:title" content="Silkyline Video Prompt Maker" />
    <meta property="og:description" content="Write your story idea and get ready-to-use scene-by-scene AI video prompts." />
    <link rel="icon" href="data:," />
    <title>Silkyline Video Prompt Maker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Noto+Nastaliq+Urdu:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f0f4f9;
        --panel: #ffffff;
        --panel-2: #f0f4f9;
        --ink: #1f1f1f;
        --ink-soft: #444746;
        --ink-faint: #747775;
        --line: #dde3ea;
        --line-strong: #c4c7c5;
        --accent: #1a73e8;
        --accent-dark: #1557b0;
        --accent-ink: #ffffff;
        --accent-soft: #e8f0fe;
        --field: #f0f4f9;
        --chip: #f0f4f9;
        --good: #1a73e8;
        --bar: #ffffff;
        --bar-ink: #1f1f1f;
        --bar-soft: #5f6368;
        --shadow-sm: none;
        --shadow: none;
        --shadow-btn: none;
        --r-lg: 24px;
        --r-md: 16px;
        --r-sm: 12px;
        /* Single uniform accent — Gemini style */
        --p1: #1a73e8; --p1bg: #e8f0fe;
        --p2: #1a73e8; --p2bg: #e8f0fe;
        --p3: #1a73e8; --p3bg: #e8f0fe;
        --p4: #1a73e8; --p4bg: #e8f0fe;
        --p5: #1a73e8; --p5bg: #e8f0fe;
        --p6: #1a73e8; --p6bg: #e8f0fe;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #131314;
          --panel: #1e1f20;
          --panel-2: #28292a;
          --ink: #e3e3e3;
          --ink-soft: #c4c7c5;
          --ink-faint: #8e918f;
          --line: #444746;
          --line-strong: #5f6368;
          --accent: #8ab4f8;
          --accent-dark: #aecbfa;
          --accent-ink: #131314;
          --accent-soft: #283142;
          --field: #28292a;
          --chip: #28292a;
          --good: #8ab4f8;
          --bar: #131314;
          --bar-ink: #e3e3e3;
          --bar-soft: #9aa0a6;
          --shadow-sm: none;
          --shadow: none;
          --shadow-btn: none;
          --p1: #8ab4f8; --p1bg: #283142;
          --p2: #8ab4f8; --p2bg: #283142;
          --p3: #8ab4f8; --p3bg: #283142;
          --p4: #8ab4f8; --p4bg: #283142;
          --p5: #8ab4f8; --p5bg: #283142;
          --p6: #8ab4f8; --p6bg: #283142;
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: 84px; scroll-padding-bottom: 104px; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 16px;
        line-height: 1.5;
      }
      button, select, input, textarea { font: inherit; color: inherit; }
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2.25rem; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      /* Urdu mode type */
      body.lang-ur { font-family: "Noto Nastaliq Urdu", "Manrope", serif; }
      body.lang-ur h1, body.lang-ur h2, body.lang-ur h3,
      body.lang-ur .app-name, body.lang-ur .out-title, body.lang-ur .scene-num {
        font-family: "Noto Nastaliq Urdu", serif;
      }
      body.lang-ur p, body.lang-ur .hint, body.lang-ur label.f, body.lang-ur .stat { line-height: 2; }
      body.lang-ur .btn, body.lang-ur select, body.lang-ur .seg button, body.lang-ur .tab { line-height: 1.8; }

      /* ---------- Uniform headers — one colour, one shape (Gemini style) ---------- */
      .hc-a, .hc-b, .hc-c, .hc-d, .hc-e, .hc-f { --hc: var(--accent); --hc-bg: var(--accent-soft); }
      .card h2 { color: var(--ink); }
      .card h2 .num {
        background: var(--accent-soft); color: var(--accent); border-radius: 999px;
        width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center;
        padding: 0; font-size: 14px; line-height: 1; flex: none;
      }
      .dot-h { width: 10px; height: 10px; border-radius: 999px; background: var(--accent); flex: none; }
      .out-title { color: var(--ink); }
      .intro h1 .hl { color: var(--accent); }
      .tpl-title {
        font-family: "Sora", sans-serif; font-size: 19px; letter-spacing: -.01em;
        margin: 0 0 6px; display: flex; align-items: center; gap: 9px; color: var(--ink);
      }

      /* ---------- App bar — Gemini style: flat, light, no dark bar ---------- */
      .appbar {
        position: sticky; top: 0; z-index: 40;
        background: var(--bar); color: var(--bar-ink);
        border-bottom: 1px solid var(--line);
        box-shadow: none;
      }
      .appbar-in {
        max-width: 1180px; margin: 0 auto; padding: 12px 16px;
        display: flex; align-items: center; gap: 12px;
        padding-top: max(12px, env(safe-area-inset-top));
      }
      .app-icon {
        width: 42px; height: 42px; flex: none; border-radius: 999px;
        background: var(--accent-soft); color: var(--accent);
        display: flex; align-items: center; justify-content: center;
        box-shadow: none;
      }
      .app-titles { min-width: 0; flex: 1; }
      .app-name {
        font-family: "Sora", sans-serif; font-weight: 700; font-size: 17px;
        line-height: 1.15; letter-spacing: .01em; white-space: nowrap;
        overflow: hidden; text-overflow: ellipsis;
      }
      .app-sub { color: var(--bar-soft); font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .app-badge {
        flex: none; display: inline-flex; align-items: center; gap: 7px;
        border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px;
        padding: 5px 12px; font-size: 12px; font-weight: 700; color: var(--bar-ink);
      }
      .app-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }

      /* Language switch */
      .lang-switch {
        flex: none; display: flex; gap: 2px; padding: 3px;
        background: var(--panel-2); border: 1px solid var(--line);
        border-radius: 999px;
      }
      .lang-switch button {
        appearance: none; border: 0; background: transparent; cursor: pointer;
        color: var(--bar-soft); font-weight: 700; font-size: 12px; line-height: 1.25;
        padding: 5px 11px; border-radius: 999px; min-height: 30px;
      }
      .lang-switch button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

      @media (max-width: 560px) {
        .app-name { font-size: 15.5px; }
        .app-sub { font-size: 11.5px; }
        .app-icon { width: 38px; height: 38px; border-radius: 999px; }
        .app-badge { display: none; }
        .lang-switch button { padding: 5px 8px; font-size: 11.5px; }
      }
      @media (max-width: 380px) { .app-name { font-size: 14.5px; } }

      .wrap { max-width: 1180px; margin: 0 auto; padding: 18px 16px 132px; }

      /* ---------- Intro ---------- */
      .intro { max-width: 720px; margin: 2px 0 14px; }
      .intro h1 {
        font-family: "Sora", sans-serif;
        font-size: clamp(25px, 4.2vw, 34px);
        line-height: 1.14;
        margin: 0 0 8px;
        letter-spacing: -0.015em;
      }
      body.lang-ur .intro h1 { line-height: 1.9; }
      .intro p { margin: 0; color: var(--ink-soft); font-size: 16px; }
      .intro p strong { color: var(--ink); }

      /* ---------- Bottom navigation (app tabs) ---------- */
      .bottomnav {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
        background: var(--panel);
        border-top: 1px solid var(--line);
        box-shadow: none;
        padding-bottom: env(safe-area-inset-bottom);
      }
      .bottomnav-in {
        max-width: 560px; margin: 0 auto;
        display: grid; grid-template-columns: 1fr 1fr 1fr;
      }
      .tab {
        appearance: none; border: 0; background: transparent; cursor: pointer;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
        padding: 9px 4px 10px; min-height: 60px;
        font-weight: 700; font-size: 12px; color: var(--ink-faint);
        position: relative;
      }
      .tab svg { display: block; }
      .tab::before {
        content: ""; position: absolute; top: 0; left: 50%; transform: translateX(-50%) scaleX(0);
        width: 44px; height: 4px; border-radius: 999px; background: var(--accent);
        transition: transform .18s ease;
      }
      .tab[aria-selected="true"] { color: var(--accent); }
      .tab[aria-selected="true"]::before { transform: translateX(-50%) scaleX(1); }
      .tab:active { background: var(--panel-2); }

      /* ---------- Layout & cards ---------- */
      .layout { display: grid; grid-template-columns: 430px 1fr; gap: 20px; align-items: start; }
      @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

      .card {
        background: var(--panel); border: 1px solid var(--line);
        border-radius: var(--r-lg); box-shadow: none;
        padding: 22px;
      }
      .card + .card { margin-top: 16px; }
      .card h2 {
        font-family: "Sora", sans-serif; font-size: 16.5px; margin: 0 0 4px;
        display: flex; align-items: center; gap: 8px; letter-spacing: .005em;
      }
      body.lang-ur .card h2 { font-family: "Noto Nastaliq Urdu", serif; line-height: 1.9; }
      .card .hint { color: var(--ink-soft); font-size: 13.5px; margin: 0 0 12px; }
      .card > *:last-child { margin-bottom: 0; }

      label.f { display: block; font-weight: 700; font-size: 13px; margin: 16px 0 6px; letter-spacing: .02em; text-transform: uppercase; color: var(--ink-soft); }
      body.lang-ur label.f { letter-spacing: 0; }
      label.f:first-of-type { margin-top: 6px; }
      .sub { font-weight: 500; color: var(--ink-faint); font-size: 12.5px; text-transform: none; letter-spacing: 0; }

      textarea, input[type="text"], input[type="number"], select {
        width: 100%; background: var(--field); border: 1px solid var(--line);
        border-radius: var(--r-md); padding: 11px 13px; font-size: 15px;
        transition: border-color .15s ease, box-shadow .15s ease;
      }
      textarea { resize: vertical; min-height: 96px; line-height: 1.55; }
      textarea:hover, input:hover, select:hover { border-color: var(--line-strong); }
      textarea:focus, input:focus, select:focus {
        outline: none; border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      select { min-height: 46px; font-weight: 600; }

      .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

      .seg { display: flex; gap: 4px; background: var(--chip); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
      .seg button {
        flex: 1; appearance: none; border: 0; cursor: pointer; text-align: center;
        padding: 9px 4px; font-weight: 700; font-size: 14px; background: transparent;
        color: var(--ink-soft); min-height: 42px; border-radius: 999px;
        transition: background .15s ease, color .15s ease;
      }
      .seg button[aria-pressed="true"] { background: var(--panel); color: var(--accent); box-shadow: 0 0 0 1px var(--line); }
      .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

      .slider-row { display: flex; align-items: center; gap: 12px; }
      .slider-row input[type="range"] { flex: 1; accent-color: var(--accent); min-height: 36px; }
      .slider-val {
        font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 14px;
        background: var(--chip); border: 1px solid var(--line); border-radius: 999px;
        padding: 4px 10px; min-width: 78px; text-align: center;
      }
      body.lang-ur .slider-val { font-family: "Noto Nastaliq Urdu", serif; }
      .mini-btn {
        border: 1px solid var(--line); background: var(--panel); color: var(--accent);
        border-radius: 999px; padding: 4px 12px; font-weight: 700; font-size: 12.5px;
        cursor: pointer; min-height: 30px; text-transform: none; letter-spacing: 0; margin-inline-start: 6px;
      }
      .mini-btn:active { background: var(--accent-soft); }

      .btn {
        appearance: none; border: 0; cursor: pointer; border-radius: 999px;
        font-weight: 700; font-size: 15.5px; padding: 12px 24px; min-height: 50px;
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        transition: background .15s ease, transform .1s ease;
      }
      .btn-primary { background: var(--accent); color: var(--accent-ink); width: 100%; margin-top: 20px; box-shadow: none; }
      .btn-primary:hover { background: var(--accent-dark); }
      @media (prefers-color-scheme: dark) { .btn-primary:hover { background: var(--accent); filter: brightness(1.08); } }
      .btn-primary:active { transform: translateY(1px); box-shadow: none; }
      .btn-ghost {
        background: var(--panel); border: 1px solid var(--line); color: var(--ink);
        min-height: 42px; padding: 8px 16px; font-size: 14px; box-shadow: none; border-radius: 999px;
      }
      .btn-ghost:hover { border-color: var(--line-strong); background: var(--panel-2); }
      .btn-ghost svg, .btn-primary svg { flex: none; }

      /* ---------- Output ---------- */
      textarea, input, select, .card, .scene, .tpl { scroll-margin-bottom: 128px; }
      .out-col { scroll-margin-top: 84px; }
      .out-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
      .out-title { font-family: "Sora", sans-serif; font-size: 19px; margin: 0; letter-spacing: -.01em; }
      body.lang-ur .out-title { letter-spacing: 0; line-height: 1.9; }
      .stats { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
      .stat {
        background: var(--panel); border: 1px solid var(--line); color: var(--ink-soft);
        border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600;
      }
      .stat b { color: var(--accent); font-weight: 700; }
      .out-actions { display: flex; gap: 8px; flex-wrap: wrap; }

      .scene {
        border: 1px solid var(--line); border-radius: var(--r-lg);
        background: var(--panel); margin-bottom: 14px; overflow: hidden;
        box-shadow: var(--shadow-sm);
      }
      .scene-head {
        display: flex; align-items: center; gap: 10px;
        background: var(--panel-2); padding: 10px 14px;
        border-bottom: 1px solid var(--line);
      }
      .scene-num {
        font-family: "Sora", sans-serif; font-weight: 700; font-size: 13px;
        background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 5px 12px;
        letter-spacing: .02em;
      }
      /* All scene numbers: one uniform colour and pill shape */
      #output .scene .scene-num { background: var(--accent-soft); color: var(--accent); }
      .scene-meta { color: var(--ink-soft); font-size: 13px; font-weight: 600; }
      .scene-head .copy-one { margin-inline-start: auto; }
      .copy-one {
        border: 1px solid var(--line); background: var(--panel); border-radius: 999px;
        padding: 6px 16px; font-weight: 700; font-size: 13.5px; cursor: pointer; min-height: 38px;
        display: inline-flex; align-items: center; gap: 6px; color: var(--accent);
        transition: border-color .15s ease, color .15s ease, background .15s ease;
      }
      .copy-one:hover { border-color: var(--accent); background: var(--accent-soft); }
      .copy-one.copied { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
      .scene textarea {
        border: 0; border-radius: 0; background: var(--panel);
        font-family: "JetBrains Mono", monospace; font-size: 13.5px; line-height: 1.65;
        min-height: 150px; padding: 15px; box-shadow: none;
      }
      .scene textarea:hover { border-color: transparent; }
      .scene textarea:focus { outline: none; box-shadow: inset 0 0 0 2px var(--accent); border-color: transparent; }

      .empty {
        border: 1px solid var(--line); border-radius: var(--r-lg);
        padding: 38px 20px; text-align: center; color: var(--ink-soft);
        background: var(--panel-2);
      }
      .empty .big { font-family: "Sora", sans-serif; color: var(--ink); font-size: 17px; margin: 0 0 6px; }
      body.lang-ur .empty .big { font-family: "Noto Nastaliq Urdu", serif; line-height: 1.9; }
      .empty p { margin: 0; font-size: 14.5px; }

      /* ---------- Templates ---------- */
      .tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
      .tpl {
        text-align: start; background: var(--panel); border: 1px solid var(--line);
        border-radius: var(--r-lg); padding: 20px; cursor: pointer; box-shadow: none;
        min-height: 44px; transition: border-color .15s ease, background .15s ease;
      }
      .tpl:hover { border-color: var(--accent); background: var(--panel-2); }
      .tpl:active { transform: none; }
      .tpl h3 { font-family: "Sora", sans-serif; font-size: 16px; margin: 0 0 6px; color: var(--ink); }
      body.lang-ur .tpl h3 { font-family: "Noto Nastaliq Urdu", serif; line-height: 1.9; }
      .tpl p { margin: 0; color: var(--ink-soft); font-size: 13.5px; }
      .tpl .tag { display: inline-block; margin-top: 12px; font-size: 12px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 5px 12px; }
      .tpl { --hc: var(--accent); --hc-bg: var(--accent-soft); }

      .toast {
        position: fixed; left: 50%; bottom: 84px; transform: translate(-50%, 24px);
        opacity: 0; background: var(--ink); color: var(--bg); border-radius: 999px;
        padding: 11px 22px; font-weight: 700; font-size: 14.5px;
        transition: transform .25s ease, opacity .25s ease; z-index: 60; pointer-events: none;
        box-shadow: 0 14px 34px -10px rgba(0,0,0,.45); max-width: calc(100vw - 32px); text-align: center;
      }
      .toast.show { transform: translate(-50%, 0); opacity: 1; }
      @media (prefers-reduced-motion: reduce) {
        .toast, .tab::before, .tpl, .seg button, .btn { transition: none; }
        .btn-primary:active, .tpl:hover { transform: none; }
        html { scroll-behavior: auto; }
      }

      /* ---------- Free image generator ---------- */
      .img-count {
        display: inline-flex; align-items: center; gap: 7px;
        background: var(--accent-soft); color: var(--ink);
        border: 1px solid var(--line); border-radius: 999px;
        padding: 6px 14px; font-size: 13px; font-weight: 600; margin: 0 0 14px;
      }
      .img-count b { color: var(--accent); font-weight: 800; }
      .img-count .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
      .img-zone { border-top: 1px solid var(--line); background: var(--panel-2); padding: 12px 14px 14px; }
      .img-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .img-btn {
        appearance: none; border: 0; cursor: pointer; border-radius: 999px;
        background: var(--accent); color: var(--accent-ink);
        font-weight: 700; font-size: 13.5px; padding: 8px 18px; min-height: 38px;
        display: inline-flex; align-items: center; gap: 7px;
      }
      .img-btn:hover {
