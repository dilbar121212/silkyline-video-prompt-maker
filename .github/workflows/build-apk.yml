name: Build Signed Release APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Setup Capacitor & Build Signed APK
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir -p www
          cp index.html www/
          npx cap init "Silkyline Studio" "com.silkyline.promptstudio" --web-dir=www
          npx cap add android
          npx cap sync android
          keytool -genkey -v -keystore release.keystore -alias silkyline -keyalg RSA -keysize 2048 -validity 10000 -storepass silky123 -keypass silky123 -dname "CN=Silkyline Studio, OU=App, O=Silkyline, L=Karachi, S=Sindh, C=PK"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk ../app-aligned.apk
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner sign --ks ../release.keystore --ks-pass pass:silky123 --key-pass pass:silky123 --out ../Silkyline-Studio-Release.apk ../app-aligned.apk
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Silkyline-Studio-Signed-APK
          path: Silkyline-Studio-Release.apk
