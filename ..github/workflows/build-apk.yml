name: Build Signed Release APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Web Assets & Capacitor with Icon
        run: |
          rm -rf www android package.json package-lock.json node_modules
          mkdir -p www
          cp index.html www/index.html
          
          # Use icon.png if it exists in the repository, otherwise create a placeholder
          if [ -f "icon.png" ]; then
            cp icon.png www/icon.png
          else
            echo "Generating fallback placeholder for icon.png"
            touch www/icon.png
          fi
          
          npm init -y
          npm install @capacitor/core@6.1.2 @capacitor/cli@6.1.2 @capacitor/android@6.1.2
          npm install @capacitor/assets@3.0.5 --save-dev
          npx cap init "Silkyline Studio" "com.silkyline.promptstudio" --web-dir=www
          npx cap add android
          
          # Generate launcher icon automatically from icon.png
          if [ -f "icon.png" ]; then
            npx cordova-res android || true
            npx capacitor-assets generate --android || true
          fi
          
          npx cap sync android

      - name: Build & Sign Release APK
        run: |
          keytool -genkey -v -keystore release.keystore -alias silkyline -keyalg RSA -keysize 2048 -validity 10000 -storepass silky123 -keypass silky123 -dname "CN=Silkyline Studio, OU=App, O=Silkyline, L=Karachi, S=Sindh, C=PK"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk ../app-aligned.apk
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner sign --ks ../release.keystore --ks-pass pass:silky123 --key-pass pass:silky123 --out ../Silkyline-Studio-Release.apk ../app-aligned.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Silkyline-Studio-Signed-APK
          path: Silkyline-Studio-Release.apk
